name: Build and Release

on:
  push:
    tags:
      - "v*"
  # 允许在 Actions 页面手动重跑，便于补发失败的 Release
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/重发的 Tag（例如 v1.3.0）"
        required: true
        type: string

permissions:
  # 创建 Release 与上传附件都需要写权限；默认 GITHUB_TOKEN 往往是只读
  contents: write

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        env:
          # 手动触发时把用户输入先落到环境变量，避免直接插值进脚本
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # 只接受 v1.2.3 这类合法 Tag，防止把任意 ref 传进 checkout
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "非法 Tag：$TAG（应形如 v1.3.0）" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.platform }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            windows/amd64,
            windows/arm64,
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 构建的是指定 Tag 的代码（已通过 resolve 校验），而不是当前分支
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get OS and ARCH
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          GOOS="${PLATFORM%%/*}"
          GOARCH="${PLATFORM##*/}"
          {
            echo "GOOS=$GOOS"
            echo "GOARCH=$GOARCH"
            echo "FORMATTED_PLATFORM=$GOOS-$GOARCH"
          } >> "$GITHUB_OUTPUT"
          if [ "$GOOS" = "windows" ]; then
            echo "EXT=.exe" >> "$GITHUB_OUTPUT"
          else
            echo "EXT=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ steps.platform.outputs.GOOS }}
          GOARCH: ${{ steps.platform.outputs.GOARCH }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          COMMIT="$(git rev-parse --short HEAD)"
          OUT="./artifacts/localsend-go-${{ steps.platform.outputs.FORMATTED_PLATFORM }}${{ steps.platform.outputs.EXT }}"
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/meowrain/localsend-go/internal/version.Version=${VERSION} \
              -X github.com/meowrain/localsend-go/internal/version.Commit=${COMMIT}" \
            -o "$OUT" \
            .
          # 冒烟检查：产物能在当前 runner 执行时才验证（linux/amd64），
          # 确认 -X 注入生效，避免发出 --version 显示 dev 的包
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            "$OUT" --version
            "$OUT" --version | grep -q "$VERSION"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend-go-${{ steps.platform.outputs.FORMATTED_PLATFORM }}
          path: artifacts/localsend-go-${{ steps.platform.outputs.FORMATTED_PLATFORM }}${{ steps.platform.outputs.EXT }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          # 需要完整历史与 Tag 才能用 git log 生成两个 Tag 之间的变更
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -lh
          # 用 * 而非 ./*，避免校验文件里出现 ./前缀
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # 本项目多数提交直接推 main、不经过 PR，GitHub 的自动生成说明几乎是空的，
          # 因此按 conventional commit 前缀从 git log 自行归类。
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            echo "对比范围：$RANGE" >&2
          else
            RANGE="${TAG}"
            echo "没有上一个 Tag，使用全部历史" >&2
          fi
          RANGE="$RANGE" python3 - <<'PY' > RELEASE_NOTES.md
          import os, re, subprocess

          groups = [
              ("feat", "新功能"),
              ("fix", "修复"),
              ("perf", "性能"),
              ("refactor", "重构"),
              ("docs", "文档"),
              ("test", "测试"),
              ("ci", "CI/CD"),
              ("build", "构建"),
              ("chore", "杂项"),
          ]
          buckets = {k: [] for k, _ in groups}
          buckets["other"] = []

          raw = subprocess.run(
              ["git", "log", "--no-merges", "--format=%h%x00%s", os.environ["RANGE"]],
              capture_output=True, text=True, check=True,
          ).stdout

          for line in raw.splitlines():
              if "\x00" not in line:
                  continue
              sha, subject = line.split("\x00", 1)
              m = re.match(r"([a-zA-Z]+)(\([^)]*\))?!?:\s*(.+)", subject)
              if m and m.group(1).lower() in buckets:
                  buckets[m.group(1).lower()].append((sha, m.group(3)))
              else:
                  buckets["other"].append((sha, subject))

          print("## 变更内容\n")
          for key, title in groups + [("other", "其他")]:
              items = buckets[key]
              if not items:
                  continue
              print(f"### {title}\n")
              for sha, subject in items:
                  print(f"- {subject} (`{sha}`)")
              print()

          print("## 安装\n")
          print("下载对应平台的压缩包解压即可；校验和见 `SHA256SUMS.txt`。")
          PY
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Release ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/localsend-go-*
            artifacts/SHA256SUMS.txt
